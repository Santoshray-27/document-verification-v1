<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agnitia — Secure Digital Document Verification Platform. Signed registry, hash verification, OCR and visual forensics." />
    <title>Agnitia · Proof in Every Pixel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1917'/%3E%3Cpath d='M16 6l8 4v7c0 5-3.4 8.3-8 9.6C11.4 25.3 8 22 8 17v-7z' fill='none' stroke='%23F59E0B' stroke-width='2'/%3E%3Cpath d='M12.5 16.5l2.6 2.6 5-5.4' fill='none' stroke='%23F59E0B' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />

    <!-- Google Fonts: Inter, JetBrains Mono, Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Anti-FOUC Theme Script (executes before first render) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('agnitia_theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
